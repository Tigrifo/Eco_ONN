  <div class="conteudo">
    <section class="section-contato">
      <h1>Entre em Contato</h1>
      <p>Tem dúvidas, sugestões ou precisa de ajuda? Entre em contato conosco!</p>
      
      <div class="contato-container">
        
        <div class="form-contato">
            <br> <br>
          <h2>Envie sua Mensagem</h2>
          <form action="processarContato.php" method="POST">
            <div class="form-group">
                <br> <br>
              <label for="nome">Nome Completo</label>
              <input id="caixa" type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
              <label for="Email">Email</label>
              <input id="caixa" type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
              <label for="mensagem">Mensagem</label>
              <textarea id="caixa" type="mensagem" name="mensagem" rows="5"   required></textarea>
            </div>
            
            <button type="submit" class="btn btn-enviar">Enviar Mensagem</button>
          </form>
        </div>
      </div>
    </section>
